<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Kotak</title>
    <link rel="stylesheet" href="./1-box.css" />
  </head>
  <body>
    <div class="container">
      <div class="kotak">
        <!-- Macam-macam tag teks -->
        <h1>Hello Dunia</h1>
        <h2>Hello Dunia</h2>
        <h6>Hello Dunia</h6>
        <p>Lorem ipsum dolor sit amet.</p>
        <span>Lorem ipsum dolor sit amet.</span>
        <strong>Lorem ipsum dolor sit amet.</strong>
        <em>Lorem ipsum dolor sit amet.</em>
      </div>
    </div>

    <!-- LI -> List Item -->
    <!-- Ordered atau Unordered List -->
    <ul>
      <li>Nasi goreng</li>
      <li>Mie Goreng</li>
      <li>Martabak</li>
    </ul>

    <ol>
      <li>Nasi goreng</li>
      <li>Mie Goreng</li>
      <li>Martabak</li>
    </ol>
  </body>
</html>
